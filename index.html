<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ═══════════════════════════════════════════════
         Primary SEO Meta Tags
    ═══════════════════════════════════════════════ -->
    <title>SafetyMate Admin — Safety Management Platform</title>
    <meta name="description" content="SafetyMate Admin Portal — manage workplace safety compliance, fire detection, fleet operations, risk assessments, and subscriber organisations from one secure dashboard." />
    <meta name="keywords" content="SafetyMate, safety management, fire detection, fire extinguisher, fleet management, workplace compliance, risk assessment, safety admin, OHS, safety dashboard" />
    <meta name="author" content="SafetyMate" />
    <meta name="application-name" content="SafetyMate Admin" />

    <!-- Block search engine indexing — this is a private admin portal -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="googlebot" content="noindex, nofollow" />

    <!-- ═══════════════════════════════════════════════
         Canonical URL — replace with your actual domain
    ═══════════════════════════════════════════════ -->
    <link rel="canonical" href="https://safetymatedashboards.com/" />

    <!-- ═══════════════════════════════════════════════
         Favicon & App Icons
    ═══════════════════════════════════════════════ -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="shortcut icon" href="/logo.png" />

    <!-- ═══════════════════════════════════════════════
         Web App Manifest (PWA)
    ═══════════════════════════════════════════════ -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#e84c1e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SafetyMate Admin" />

    <!-- ═══════════════════════════════════════════════
         Open Graph — controls how link previews look
         when shared on Slack, WhatsApp, LinkedIn, etc.
    ═══════════════════════════════════════════════ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SafetyMate Admin" />
    <meta property="og:title" content="SafetyMate Admin — Safety Management Platform" />
    <meta property="og:description" content="Secure admin portal for managing workplace safety compliance, fire detection, fleet operations, and subscriber organisations." />
    <meta property="og:image" content="https://safetymatedashboards.com/logo.png" />
    <meta property="og:image:alt" content="SafetyMate logo" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:url" content="https://safetymatedashboards.com/" />
    <meta property="og:locale" content="en_AU" />

    <!-- ═══════════════════════════════════════════════
         Twitter / X Card
    ═══════════════════════════════════════════════ -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SafetyMate Admin — Safety Management Platform" />
    <meta name="twitter:description" content="Secure admin portal for managing workplace safety compliance, fire detection, fleet operations, and subscriber organisations." />
    <meta name="twitter:image" content="https://safetymatedashboards.com/logo.png" />
    <meta name="twitter:image:alt" content="SafetyMate logo" />

    <!-- ═══════════════════════════════════════════════
         Security Headers (via meta where applicable)
    ═══════════════════════════════════════════════ -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- ═══════════════════════════════════════════════
         Fonts
    ═══════════════════════════════════════════════ -->
    <link rel="preconnect" href="https://rsms.me" crossorigin />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
